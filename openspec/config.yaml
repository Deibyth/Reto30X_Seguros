schema: spec-driven

context: |
  Product: ProteccionInteligente360, an AI-assisted insurance platform for Colsubsidio affiliates.
  Stack: Python 3.12, FastAPI, Pydantic, async SQLAlchemy/SQLite, FastMCP, OpenAI-compatible AI, and APScheduler.
  Frontend: React 18, TypeScript 5.7 strict mode, Vite 6, Tailwind CSS, TanStack Query, and pnpm 9 on Node 20.
  Architecture: layered modular monolith with FastAPI routers, services, models/database, AI/tool adapters, and outbound scheduling.
  Delivery: Docker Compose runs the backend and frontend; the current change branch is feature/multicanal.
  Testing: pytest unit/integration suite with async and HTTP support; no frontend test runner or E2E suite.
  Quality: frontend strict TypeScript build; no configured linter or formatter.

workflow:
  execution_mode: interactive
  artifact_store:
    mode: hybrid
  chained_pr_strategy: force-chained
  review_budget_lines: 400

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
    tdd: true
    test_command: "python -m pytest -c backend/pyproject.toml backend/tests -x -q"
  verify:
    test_command: "python -m pytest -c backend/pyproject.toml backend/tests -x -q"
    build_command: "pnpm --dir frontend run build"
    coverage_threshold: 60
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: true
  detected: "2026-07-24"
  test_runner:
    framework: pytest
    command: "python -m pytest -c backend/pyproject.toml backend/tests -x -q"
    environment: "Python 3.12 with backend test extras"
  layers:
    unit: "pytest + pytest-asyncio"
    integration: "httpx + FastAPI TestClient"
    e2e: null
  coverage:
    tool: pytest-cov
    command: "python -m pytest -c backend/pyproject.toml backend/tests --cov=app --cov-report=term-missing"
    threshold: 60
  quality:
    linter: null
    type_checker:
      tool: "TypeScript strict mode"
      command: "pnpm --dir frontend run build"
    formatter: null
